<text x='84' y='596' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#8a8578'>... actor a WHERE a.actor_id IN (SELECT fa.actor_id FROM film_actor fa WHERE fa.film_id = 42)  &#183;  uz semijoin=off</text>
<line x1='26' y1='608' x2='1274' y2='608' stroke='#d8d3c8' stroke-width='1'/>
<rect x='26' y='614' width='5' height='46' fill='#b07d1a'/>
<text x='64' y='635' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#8a8578'>9.</text>
<text x='84' y='636' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='16.5' font-weight='bold' fill='#b07d1a'>index_subquery</text>
<text x='272' y='635' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>idx_fk_country_id</text>
<text x='594' y='635' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>5</text>
<text x='636' y='635' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>100.00</text>
