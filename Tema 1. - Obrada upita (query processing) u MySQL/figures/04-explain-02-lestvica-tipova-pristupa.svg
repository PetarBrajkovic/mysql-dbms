<text x='84' y='456' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='16.5' font-weight='bold' fill='#b07d1a'>ref_or_null</text>
<text x='272' y='455' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>fk_payment_rental</text>
