<text x='84' y='656' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#8a8578'>... country c WHERE c.country_id IN (SELECT ci.country_id FROM city ci)  &#183;  uz semijoin=off</text>
<line x1='26' y1='668' x2='1274' y2='668' stroke='#d8d3c8' stroke-width='1'/>
<rect x='26' y='674' width='5' height='46' fill='#b07d1a'/>
<text x='64' y='695' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#8a8578'>10.</text>
<text x='84' y='696' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='16.5' font-weight='bold' fill='#b07d1a'>range</text>
<text x='272' y='695' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>PRIMARY</text>
<text x='594' y='695' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>50</text>
<text x='636' y='695' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>100.00</text>
<text x='716' y='695' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#5a564c'>Using where</text>
<text x='84' y='716' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#8a8578'>SELECT * FROM film WHERE film_id BETWEEN 1 AND 50</text>
<line x1='26' y1='728' x2='1274' y2='728' stroke='#d8d3c8' stroke-width='1'/>
<rect x='26' y='734' width='5' height='46' fill='#7a1f1f'/>
<text x='64' y='755' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#8a8578'>11.</text>
<text x='84' y='756' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='16.5' font-weight='bold' fill='#7a1f1f'>index</text>
<text x='272' y='755' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>idx_title</text>
<text x='594' y='755' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>1000</text>
<text x='636' y='755' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>100.00</text>
<text x='716' y='755' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#5a564c'>Using index</text>
<text x='84' y='776' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#8a8578'>SELECT title FROM film ORDER BY title</text>
<line x1='26' y1='788' x2='1274' y2='788' stroke='#d8d3c8' stroke-width='1'/>
<rect x='26' y='794' width='5' height='46' fill='#7a1f1f'/>
<text x='64' y='815' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='14' fill='#8a8578'>12.</text>
<text x='84' y='816' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='16.5' font-weight='bold' fill='#7a1f1f'>ALL</text>
<text x='272' y='815' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>-</text>
<text x='594' y='815' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>1000</text>
<text x='636' y='815' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>11.11</text>
<text x='716' y='815' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#5a564c'>Using where</text>
<text x='84' y='836' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#8a8578'>SELECT * FROM film WHERE description LIKE '%robot%'</text>
<line x1='26' y1='848' x2='1274' y2='848' stroke='#1a1a1a' stroke-width='1.2'/>
<text x='26' y='882' font-family="Georgia, 'Times New Roman', serif" font-size='13' font-weight='bold' fill='#1a1a1a'>Boja ka&#382;e koliko torki jedan pristup mo&#382;e da vrati:</text>
<rect x='26' y='898' width='11' height='11' fill='#1f5c7a'/>
<text x='46' y='908' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#5a564c'>najvi&#353;e jedna torka, jednom po upitu</text>
<rect x='26' y='919' width='11' height='11' fill='#2e6b2e'/>
<text x='46' y='929' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#5a564c'>najvi&#353;e jedna torka, po spoljnoj torki</text>
<rect x='26' y='940' width='11' height='11' fill='#b07d1a'/>
<text x='46' y='950' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#5a564c'>vi&#353;e torki, ali kroz indeks</text>
<rect x='26' y='961' width='11' height='11' fill='#7a1f1f'/>
<text x='46' y='971' font-family="Georgia, 'Times New Roman', serif" font-size='13' fill='#5a564c'>cela struktura se pro&#269;ita</text>
<text x='1274' y='908' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='12.5' fill='#5a564c'>Redosled je onaj iz priru&#269;nika, a ne redosled cena: range nad 50 torki je jeftiniji</text>
<text x='1274' y='927' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='12.5' fill='#5a564c'>od ref nad pet miliona. Tip govori o obliku pristupa, cenu ra&#269;una model cene.</text>
<text x='1274' y='953' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='12.5' fill='#5a564c'>Rangovi 8 i 9 postoje samo ako se transformacija u poluspoj isklju&#269;i: ina&#269;e</text>
<text x='1274' y='972' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='12.5' fill='#5a564c'>ona pojede podupit pre nego &#353;to se tip pristupa uop&#353;te bira.</text>
</svg>

