<svg xmlns='http://www.w3.org/2000/svg' width='1300' height='1016' viewBox='0 0 1300 1016'>
<rect width='1300' height='1016' fill='#ffffff'/>
<text x='650' y='44' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='25' font-weight='bold' fill='#1a1a1a'>Dvanaest tipova pristupa, od najboljeg do najgoreg</text>
