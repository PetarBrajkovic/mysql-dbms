<text x='636' y='395' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#1a1a1a'>100.00</text>
<text x='716' y='395' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#5a564c'>Using where; Ft_hints: sorted</text>
<text x='84' y='416' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#8a8578'>... film_text WHERE MATCH(title, description) AGAINST ('astronaut')</text>
