<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='658' viewBox='0 0 1180 658'><rect width='1180' height='658' fill='#ffffff'/><text x='590' y='44' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='25' font-weight='bold' fill='#1a1a1a'>Procenjeno naspram stvarnog, čvor po čvor</text>
<text x='590' y='70' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13' fill='#5a564c'>SELECT c.first_name, c.last_name, p.amount FROM customer c JOIN payment p ON p.customer_id = c.customer_id WHERE p.amount &gt; 10</text>
<text x='590' y='93' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='13.5' fill='#8a8578'>EXPLAIN ANALYZE, baza sakila, MySQL 8.4.11 · ispis levo je doslovan, brojevi desno su iz njega pročitani</text>
