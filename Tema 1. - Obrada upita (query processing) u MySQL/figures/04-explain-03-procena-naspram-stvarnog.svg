<rect x='28' y='194' width='1082' height='30' fill='#7a1f1f' opacity='0.06'/>
<text x='40' y='216' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13' fill='#1a1a1a' xml:space='preserve'>    -&gt; Filter: (p.amount &gt; 10.00)</text>
<text x='800' y='216' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1f5c7a'>5.499</text>
<text x='950' y='216' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#7a1f1f'>114</text>
<rect x='1010' y='198' width='100' height='26' rx='5' fill='#a32020' opacity='0.13'/><text x='1060' y='216' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='14' font-weight='bold' fill='#a32020'>48×</text>
<text x='40' y='250' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13' fill='#1a1a1a' xml:space='preserve'>        -&gt; Table scan on p</text>
<text x='800' y='250' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1f5c7a'>16.500</text>
<text x='950' y='250' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#7a1f1f'>16.044</text>
