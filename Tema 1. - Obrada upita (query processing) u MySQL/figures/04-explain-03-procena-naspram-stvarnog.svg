<text x='40' y='284' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13' fill='#1a1a1a' xml:space='preserve'>    -&gt; Single-row index lookup on c using PRIMARY (customer_id=p.customer_id)</text>
<text x='800' y='284' text-anchor='end' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1f5c7a'>1</text>
