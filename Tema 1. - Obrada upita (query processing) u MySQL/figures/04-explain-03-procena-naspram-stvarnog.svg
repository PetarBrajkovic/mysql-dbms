<line x1='40' y1='298' x2='1110' y2='298' stroke='#d8d3c8' stroke-width='1'/>
<text x='40' y='334' font-family="Georgia, 'Times New Roman', serif" font-size='16' font-weight='bold' fill='#1a1a1a'>Sken je pogođen, filter iznad njega nije</text>
<text x='40' y='359' font-family="Georgia, 'Times New Roman', serif" font-size='14.5' fill='#5a564c' xml:space='preserve'>Sken tabele: procena 16.500, izmereno 16.044. Promašaj od nekoliko procenata, jer broj torki u tabeli server zna iz</text>
<text x='40' y='381' font-family="Georgia, 'Times New Roman', serif" font-size='14.5' fill='#5a564c' xml:space='preserve'>statistike mehanizma skladištenja. Filter iznad njega: procena 5.499, izmereno 114, dakle 48 puta manje.</text>
<text x='40' y='403' font-family="Georgia, 'Times New Roman', serif" font-size='14.5' fill='#5a564c' xml:space='preserve'>Broj 5.499 nije izmeren nego izveden, iz kolone filtered = 33,33%. A 33,33% nije statistika nego ugrađena pretpostavka</text>
<text x='40' y='425' font-family="Georgia, 'Times New Roman', serif" font-size='14.5' fill='#5a564c' xml:space='preserve'>za poređenje tipa > nad kolonom bez indeksa i bez histograma. Stvarno prolazi 0,711% torki, i to je cela razlika.</text>
<rect x='26' y='447' width='1084' height='186' fill='#f6f4ef' stroke='#d8d3c8' stroke-width='1' rx='4'/>
<text x='40' y='487' font-family="Georgia, 'Times New Roman', serif" font-size='16' font-weight='bold' fill='#1a1a1a'>Isti potez, dva ishoda: histogram pomogne samo kad kolona nema indeks</text>
<text x='40' y='518' font-family="Georgia, 'Times New Roman', serif" font-size='13.5' font-weight='bold' fill='#2e6b2e'>payment.amount · BEZ indeksa</text>
<text x='600' y='518' font-family="Georgia, 'Times New Roman', serif" font-size='13.5' font-weight='bold' fill='#a32020'>wide_events.country_code · SA indeksom</text>
<text x='40' y='543' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c' xml:space='preserve'>UPDATE HISTOGRAM ON amount WITH 32 BUCKETS</text>
<text x='600' y='543' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c' xml:space='preserve'>UPDATE HISTOGRAM ON country_code WITH 16 BUCKETS</text>
<text x='40' y='564' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c' xml:space='preserve'>filtered:  33.33  →  0.71   (19 korpi, singleton)</text>
<text x='600' y='564' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c' xml:space='preserve'>procena pre histograma:   rows=2.45e+6</text>
<text x='40' y='585' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c' xml:space='preserve'>procena:   5.499  →  117   stvarno 114</text>
<text x='600' y='585' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c' xml:space='preserve'>procena posle histograma: rows=2.45e+6</text>
<text x='40' y='614' font-family="Georgia, 'Times New Roman', serif" font-size='14.5' font-weight='bold' fill='#2e6b2e'>odstupanje 48× → 1,03× · zatvoreno</text>
<text x='600' y='614' font-family="Georgia, 'Times New Roman', serif" font-size='14.5' font-weight='bold' fill='#a32020'>procena se nije pomerila · zaron u indeks jači od histograma</text>
