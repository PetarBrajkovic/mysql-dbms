<rect x='303.8' y='756' width='234.4' height='68' rx='8' fill='#ffffff' stroke='#c9c3b6' stroke-width='1.3'/>
<text x='421' y='782' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1a1a1a'>Filter: (c.`active` = 1)</text>
<text x='421' y='801' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#2e6b2e'>FilterIterator</text>
<text x='421' y='817' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#5a564c'>rows=584   loops=1</text>
<rect x='283.6' y='868' width='274.9' height='68' rx='8' fill='#f5f2ec' stroke='#c9c3b6' stroke-width='1.3'/>
<text x='421' y='894' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1a1a1a'>Index scan on c using PRIMARY</text>
<text x='421' y='913' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#2e6b2e'>IndexScanIterator&lt;false&gt;</text>
