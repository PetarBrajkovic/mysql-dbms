<text x='688.8' y='334' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1a1a1a'>Sort: n DESC, limit input to 5 row(s) per chunk</text>
<text x='688.8' y='353' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#2e6b2e'>SortingIterator</text>
<text x='688.8' y='369' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#5a564c'>rows=5   loops=1</text>
<rect x='606.6' y='420' width='164.2' height='68' rx='8' fill='#ffffff' stroke='#c9c3b6' stroke-width='1.3'/>
<text x='688.8' y='446' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1a1a1a'>Stream results</text>
<text x='688.8' y='465' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#2e6b2e'>StreamingIterator</text>
<text x='688.8' y='481' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#5a564c'>rows=584   loops=1</text>
<rect x='567.5' y='532' width='242.5' height='68' rx='8' fill='#ffffff' stroke='#c9c3b6' stroke-width='1.3'/>
<text x='688.8' y='558' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1a1a1a'>Group aggregate: count(0)</text>
<text x='688.8' y='577' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#2e6b2e'>AggregateIterator</text>
