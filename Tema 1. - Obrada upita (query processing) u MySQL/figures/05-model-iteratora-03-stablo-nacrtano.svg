<rect x='616.5' y='756' width='679.9' height='68' rx='8' fill='#f5f2ec' stroke='#c9c3b6' stroke-width='1.3'/>
<text x='956.4' y='782' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1a1a1a'>Covering index lookup on r using idx_fk_customer_id (customer_id=c.customer_id)</text>
