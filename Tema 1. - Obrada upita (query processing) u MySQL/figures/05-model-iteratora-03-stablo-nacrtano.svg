<text x='662.8' y='286' text-anchor='end' font-family="Georgia, 'Times New Roman', serif" font-size='14' font-weight='bold' fill='#7a1f1f'>poziv Read() &#8595;</text>
<text x='714.8' y='286' font-family="Georgia, 'Times New Roman', serif" font-size='14' font-weight='bold' fill='#2e6b2e'>&#8593; jedna torka</text>
<text x='1046.4' y='714' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13' font-weight='bold' fill='#7a1f1f'>Init() + Read(), 584&#215;</text>
<text x='1046.4' y='732' font-family="Georgia, 'Times New Roman', serif" font-size='12.5' fill='#5a564c'>jednom po torki spolja&#353;njeg ulaza</text>
<rect x='600.4' y='196' width='176.8' height='68' rx='8' fill='#ffffff' stroke='#c9c3b6' stroke-width='1.3'/>
<text x='688.8' y='222' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='13.5' fill='#1a1a1a'>Limit: 5 row(s)</text>
<text x='688.8' y='241' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12' fill='#2e6b2e'>LimitOffsetIterator</text>
<text x='688.8' y='257' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#5a564c'>rows=5   loops=1</text>
