<text x='956.4' y='926' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='11.5' fill='#8a8578'>idx_fk_customer_id</text>
<rect x='40' y='1084' width='1500' height='78' fill='#7a1f1f' opacity='0.06'/>
<text x='790' y='1108' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='16' font-weight='bold' fill='#7a1f1f'>8 objekata &#183; 7 grana &#183; 2 lista dodiruju tabele</text>
<text x='790' y='1130' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='13.5' fill='#5a564c'>Nijedan &#269;vor ne zna ceo plan: zna samo svoju decu, koju pita za slede&#263;u torku. Grananje postoji ta&#269;no tamo gde postoji spoj.</text>
<text x='790' y='1152' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='13.5' fill='#5a564c'>Isti ispis i ista merenja kao na prethodnoj slici &#183; ovde je samo nacrtano ono &#353;to uvla&#269;enje u ispisu ionako zna&#269;i.</text>
</svg>

