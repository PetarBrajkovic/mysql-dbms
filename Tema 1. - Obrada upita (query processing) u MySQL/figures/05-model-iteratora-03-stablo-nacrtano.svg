<svg xmlns='http://www.w3.org/2000/svg' width='1580' height='1188' viewBox='0 0 1580 1188'>
<rect width='1580' height='1188' fill='#ffffff'/>
<text x='790' y='46' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='25' font-weight='bold' fill='#1a1a1a'>Isto stablo, nacrtano: kontrola ide nadole, torke se vra&#263;aju nagore</text>
<text x='790' y='76' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='13.5' fill='#5a564c'>Svaki pravougaonik je jedan objekat koji za vreme izvr&#353;avanja postoji u memoriji; svaka grana je jedan poziv metoda &#183; MySQL 8.4.11, baza sakila</text>
<text x='790' y='150' text-anchor='middle' font-family="Georgia, 'Times New Roman', serif" font-size='12.5' fill='#8a8578'>U svakom pravougaoniku: red ispisa, ispod njega klasa iteratora, pa izmerene vrednosti rows i loops</text>
<text x='790' y='106' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c'>SELECT c.last_name, COUNT(*) AS n FROM customer c JOIN rental r ON r.customer_id = c.customer_id</text>
<text x='790' y='124' text-anchor='middle' font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size='12.5' fill='#5a564c'>WHERE c.active = 1 GROUP BY c.customer_id ORDER BY n DESC LIMIT 5</text>
<defs>
<marker id='m3down' markerWidth='10' markerHeight='10' refX='5' refY='9' orient='auto'><path d='M0,0 L5,9 L10,0 Z' fill='#7a1f1f'/></marker>
<marker id='m3up' markerWidth='10' markerHeight='10' refX='5' refY='1' orient='auto'><path d='M0,10 L5,1 L10,10 Z' fill='#2e6b2e'/></marker>
</defs>
